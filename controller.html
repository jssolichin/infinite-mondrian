<!DOCTYPE html>
<html>
<head lang="en">
    <link rel="shortcut icon" href="assets/img/infinite.ico" type="image/x-icon">
    <link rel="icon" href="assets/img/infinite.ico" type="image/x-icon">
    <meta charset="UTF-8">

    <title>Infinite Mondrian - Controller</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">

    <link href="bower_components/material-design-icons/sprites/svg-sprite/svg-sprite-image.css" rel="stylesheet">
    <link href="bower_components/animate.css/animate.min.css" rel="stylesheet">

    <link href="assets/css/controller-style.css" rel="stylesheet">
</head>
<body>

    <div id="controls">
        <ul class="clearfix">
            <li>
                <ul>
                    <li id="decrement-fov" class="button"><div class="left icon svg-ic_navigate_before_24px"></div></li>
                    <li><div class="left icon svg-ic_panorama_horizontal_24px"></div></li>
                    <li id="increment-fov"  class="button"><div class="left icon svg-ic_navigate_next_24px"></div></li>
                </ul>
            </li>
            <li id="toggle-fog" class="button"><div class="icon svg-ic_wb_cloudy_24px"></div></li>
            <li id="toggle-camera" class="button"><div class="icon svg-ic_switch_camera_24px"></div></li>
            <li id="take-picture" class="button"><div class="icon svg-ic_camera_alt_24px"></div></li>
        </ul>
        <div id="trigger"></div>
    </div>

    <div id="photo-roll">
        <ul>
        </ul>
    </div>

    <!-- shown only where the browser needs permission for motion (iOS 13+) -->
    <button id="enable-motion" class="button" hidden><img class="icon" src="assets/img/ic_screen_rotation_24px.svg" alt=""><span>tap to steer</span></button>

    <script src="lib/peerjs-1.5.5.min.js"></script>
    <script src="bower_components/pleasejs/dist/Please.js"></script>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/controller.js"></script>
    <script src="assets/js/shareHandler.js"></script>
    <script src="assets/js/controlHandler.js"></script>

</body>
</html>
